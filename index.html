<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="创作矩阵">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>创作矩阵</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12" x-data="contentApp()">

<header class="bg-white border-b border-slate-200 sticky top-0 z-10">
  <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
    <h1 class="font-bold text-lg text-slate-900">🚀 创作矩阵</h1>
    <div class="flex items-center gap-1.5">
      <button @click="showPlatformModal = true" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg font-medium">📡 平台</button>
      <button @click="showToolModal = true" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg font-medium">🛠️ 工具箱</button>
      <button @click="openBackup()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg font-medium">💾 备份</button>
    </div>
  </div>
</header>

<main class="max-w-md mx-auto px-4 mt-4 space-y-4">
  <button @click="openModal()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-medium text-sm shadow-sm">+ 新增内容资产</button>

  <div class="grid grid-cols-4 gap-2">
    <div @click="filterStatus = '全部'" class="bg-white p-2.5 rounded-xl border text-center cursor-pointer" :class="filterStatus === '全部' ? 'border-indigo-600 ring-1 ring-indigo-600 bg-indigo-50/30' : 'border-slate-200'">
      <div class="text-[10px] text-slate-400">全部</div><div class="text-base font-bold" x-text="items.length">0</div></div>
    <div @click="filterStatus = '已发布'" class="bg-white p-2.5 rounded-xl border text-center cursor-pointer" :class="filterStatus === '已发布' ? 'border-emerald-600 ring-1 ring-emerald-600 bg-emerald-50/30' : 'border-slate-200'">
      <div class="text-[10px] text-slate-400">已发布</div><div class="text-base font-bold text-emerald-600" x-text="items.filter(i => i.status === '已发布').length">0</div></div>
    <div @click="filterStatus = '制作中'" class="bg-white p-2.5 rounded-xl border text-center cursor-pointer" :class="filterStatus === '制作中' ? 'border-amber-600 ring-1 ring-amber-600 bg-amber-50/30' : 'border-slate-200'">
      <div class="text-[10px] text-slate-400">制作中</div><div class="text-base font-bold text-amber-600" x-text="items.filter(i => i.status === '制作中').length">0</div></div>
    <div @click="filterStatus = '想法'" class="bg-white p-2.5 rounded-xl border text-center cursor-pointer" :class="filterStatus === '想法' ? 'border-slate-600 ring-1 ring-slate-600 bg-slate-100/50' : 'border-slate-200'">
      <div class="text-[10px] text-slate-400">想法</div><div class="text-base font-bold text-slate-600" x-text="items.filter(i => i.status === '想法').length">0</div></div>
  </div>

  <div class="space-y-3">
    <div class="flex justify-between items-center px-1">
      <h2 class="font-semibold text-sm text-slate-600">内容资产台账</h2>
      <span class="text-xs text-slate-400" x-text="'当前筛选: ' + filterStatus"></span>
    </div>
    <div class="px-1 -mt-1 text-xs text-slate-400" x-text="'本月新增 ' + items.filter(i => (i.createdAt||'').slice(0,7) === new Date().toISOString().slice(0,7)).length + ' 条 · 已发布 ' + items.filter(i => i.status === '已发布').length + ' 条'"></div>

    <template x-if="filteredItems.length === 0">
      <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-8 text-center text-slate-400 text-sm">这里空空如也，有新想法时点上方 ＋ 记录下来吧</div>
    </template>

    <template x-for="item in filteredItems" :key="item.id">
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs space-y-2.5">
        <div class="flex justify-between items-start">
          <span class="text-xs px-2 py-0.5 rounded-md font-medium" :class="{'bg-emerald-50 text-emerald-700': item.status === '已发布','bg-amber-50 text-amber-700': item.status === '制作中','bg-slate-100 text-slate-600': item.status === '想法'}" x-text="item.status"></span>
          <div class="flex items-center gap-1.5">
            <button @click="editItem(item)" class="text-slate-400 text-xs px-2 py-0.5 bg-slate-50 rounded border border-slate-200">编辑</button>
            <button @click="deleteItem(item.id)" class="text-slate-300 text-xs px-1.5 py-0.5">✕</button>
          </div>
        </div>
        <h3 class="font-medium text-slate-900 text-sm" x-text="item.title"></h3>
        <div class="flex items-center gap-1.5 flex-wrap">
          <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md" x-text="formIcon(item.form) + ' ' + (item.form || '图文')"></span>
          <template x-if="item.link"><a :href="item.link" target="_blank" rel="noopener" class="text-[10px] text-indigo-600 underline">🔗 原文链接</a></template>
        </div>
        <div class="flex flex-wrap items-center gap-1.5">
          <span class="text-[10px] text-slate-400">发布平台</span>
          <template x-for="plat in (item.platforms || (item.platform ? [item.platform] : []))" :key="plat">
            <span class="text-[10px] font-medium px-2 py-0.5 rounded-full inline-flex items-center gap-1"
              :style="'background:' + platBrand(plat).bg + ';color:' + platBrand(plat).fg">
              <span x-text="platBrand(plat).icon"></span><span x-text="plat"></span>
            </span>
          </template>
        </div>
        <template x-if="item.refPlatforms && item.refPlatforms.length">
          <div class="flex flex-wrap items-center gap-1.5 bg-amber-50/60 border border-amber-100 rounded-xl px-2.5 py-1.5">
            <span class="text-[10px] text-amber-700 font-medium">📌 参考</span>
            <template x-for="plat in item.refPlatforms" :key="plat">
              <span class="text-[10px] font-medium px-2 py-0.5 rounded-full inline-flex items-center gap-1"
                :style="'background:' + platBrand(plat).bg + ';color:' + platBrand(plat).fg">
                <span x-text="platBrand(plat).icon"></span><span x-text="plat"></span>
              </span>
            </template>
            <template x-if="item.refNote"><span class="text-[10px] text-slate-500 w-full" x-text="'出处：' + item.refNote"></span></template>
          </div>
        </template>
        <template x-if="item.tools && item.tools.length > 0">
          <div class="flex flex-wrap gap-1 pt-1">
            <template x-for="t in item.tools"><span class="text-[10px] bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md border border-indigo-100" x-text="'🛠️ ' + t"></span></template>
          </div>
        </template>
        <template x-if="trendSvg(item.trafficHistory)">
          <div class="bg-indigo-50/40 border border-indigo-100/60 rounded-xl px-2.5 pt-1.5 pb-1">
            <div class="flex justify-between items-center">
              <span class="text-[10px] text-slate-400">热度 · 时间曲线</span>
              <span class="text-[9px] font-medium" :class="trendChart(item.trafficHistory).delta.up ? 'text-emerald-600' : 'text-rose-500'" x-text="trendChart(item.trafficHistory).delta.txt + ' · 共' + item.trafficHistory.length + '次'"></span>
            </div>
            <svg viewBox="0 0 120 40" class="w-full h-12 block" x-html="trendSvg(item.trafficHistory)"></svg>
            <div class="flex justify-between text-[8px] text-slate-400 -mt-0.5">
              <span x-text="trendChart(item.trafficHistory).first.d.slice(5)"></span>
              <span x-text="trendChart(item.trafficHistory).last.d.slice(5)"></span>
            </div>
          </div>
        </template>
        <div class="grid grid-cols-3 gap-1 pt-2 border-t border-slate-100 text-[11px] text-slate-500">
          <div><span class="text-slate-400 block text-[10px]">创建</span><span x-text="item.createdAt || '-'"></span></div>
          <div><span class="text-slate-400 block text-[10px]">发布</span><span x-text="item.publishDate || '未发布'"></span></div>
          <div class="text-right">
            <span class="text-slate-400 block text-[10px]">当前流量</span>
            <span class="font-semibold text-indigo-600" x-text="item.traffic || '0'"></span>
            <button @click="quickTraffic(item)" class="text-[10px] text-indigo-500 underline ml-1">更新</button>
            <template x-if="item.trafficHistory && item.trafficHistory.length"><span class="text-slate-400 block text-[9px]" x-text="'更新于 ' + item.trafficHistory[item.trafficHistory.length-1].d + ' · 共' + item.trafficHistory.length + '次'"></span></template>
          </div>
        </div>
      </div>
    </template>
  </div>
</main>

<!-- 平台档案 -->
<div x-show="showPlatformModal" class="fixed inset-0 bg-black/40 flex items-center justify-center z-30 p-4" x-cloak>
  <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center"><h3 class="font-bold text-base">📡 平台档案</h3><button @click="showPlatformModal = false; showPlatformForm = false" class="text-slate-400 text-sm">关闭</button></div>

    <template x-if="!showPlatformForm">
      <div class="space-y-3">
        <button @click="openPlatformForm()" class="w-full border border-dashed border-indigo-300 text-indigo-600 py-2 rounded-xl text-sm font-medium">+ 新增平台</button>
        <div class="space-y-2 max-h-72 overflow-y-auto">
          <template x-for="(p, index) in platforms" :key="p.name">
            <div class="bg-slate-50 px-3 py-2.5 rounded-xl border border-slate-100 space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="text-xs font-medium px-2 py-0.5 rounded-full inline-flex items-center gap-1" :style="'background:' + platBrand(p.name).bg + ';color:' + platBrand(p.name).fg"><span x-text="platBrand(p.name).icon"></span><span x-text="p.name"></span></span>
                <div class="flex gap-3">
                  <button @click="openPlatformForm(p, index)" class="text-indigo-500 text-xs">编辑</button>
                  <button @click="removePlatform(index)" class="text-slate-400 text-xs">删除</button>
                </div>
              </div>
              <template x-if="p.topics"><div class="text-xs text-slate-600" x-text="'运营内容：' + p.topics"></div></template>
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-[10px] px-1.5 py-0.5 rounded font-medium" :class="p.source.indexOf('自创') === 0 ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'" x-text="p.source"></span>
                <template x-if="p.note"><span class="text-[10px] text-slate-400" x-text="p.note"></span></template>
              </div>
            </div>
          </template>
          <template x-if="platforms.length === 0"><div class="text-center text-slate-400 text-xs py-4">还没有平台，点上方新增一个吧</div></template>
        </div>
      </div>
    </template>

    <template x-if="showPlatformForm">
      <div class="space-y-3">
        <div><label class="block text-xs font-medium text-slate-600 mb-1">平台名称</label>
          <input type="text" x-model="platformForm.name" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="例如：小红书"></div>
        <div><label class="block text-xs font-medium text-slate-600 mb-1">运营内容方向</label>
          <input type="text" x-model="platformForm.topics" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="例如：AI 工具、两性情感"></div>
        <div><label class="block text-xs font-medium text-slate-600 mb-1">内容来源</label>
          <select x-model="platformForm.source" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm"><template x-for="s in PLATFORM_SOURCES" :key="s"><option x-text="s"></option></template></select></div>
        <div><label class="block text-xs font-medium text-slate-600 mb-1">平台特点备注</label>
          <input type="text" x-model="platformForm.note" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="例如：流量大但审核严、用户偏年轻"></div>
        <div class="flex gap-2">
          <button @click="showPlatformForm = false" class="flex-1 bg-slate-100 text-slate-600 py-2 rounded-xl text-sm font-medium">取消</button>
          <button @click="savePlatform()" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-sm font-medium">保存</button>
        </div>
      </div>
    </template>
  </div>
</div>

<!-- 工具档案 -->
<div x-show="showToolModal" class="fixed inset-0 bg-black/40 flex items-center justify-center z-30 p-4" x-cloak>
  <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center"><h3 class="font-bold text-base">🛠️ 工具档案</h3><button @click="showToolModal = false; showToolForm = false" class="text-slate-400 text-sm">关闭</button></div>
    <p class="text-xs text-slate-400">记录每个工具的功能、版本与成熟度，方便在内容创作时选用。</p>

    <template x-if="!showToolForm">
      <div class="space-y-3">
        <button @click="openToolForm()" class="w-full border border-dashed border-indigo-300 text-indigo-600 py-2 rounded-xl text-sm font-medium">+ 新增工具</button>
        <div class="space-y-2 max-h-72 overflow-y-auto">
          <template x-for="(t, index) in tools" :key="t.name">
            <div class="bg-slate-50 px-3 py-2.5 rounded-xl border border-slate-100 space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="text-sm font-medium text-slate-800" x-text="'🛠️ ' + t.name"></span>
                <div class="flex items-center gap-2">
                  <span class="text-[10px] px-1.5 py-0.5 rounded font-medium" :class="maturityClass(t.maturity)" x-text="t.maturity"></span>
                  <button @click="openToolForm(t, index)" class="text-indigo-500 text-xs">编辑</button>
                  <button @click="removeTool(index)" class="text-slate-400 text-xs">删除</button>
                </div>
              </div>
              <template x-if="t.func"><div class="text-xs text-slate-600" x-text="'功能：' + t.func"></div></template>
              <template x-if="t.version"><div class="text-[10px] text-slate-400" x-text="'版本：' + t.version"></div></template>
            </div>
          </template>
          <template x-if="tools.length === 0"><div class="text-center text-slate-400 text-xs py-4">还没有工具，点上方新增一个吧</div></template>
        </div>
      </div>
    </template>

    <template x-if="showToolForm">
      <div class="space-y-3">
        <div><label class="block text-xs font-medium text-slate-600 mb-1">工具名称</label>
          <input type="text" x-model="toolForm.name" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="例如：文字生成图片"></div>
        <div><label class="block text-xs font-medium text-slate-600 mb-1">功能描述</label>
          <input type="text" x-model="toolForm.func" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="例如：输入文案自动配图"></div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="block text-xs font-medium text-slate-600 mb-1">实现版本</label>
            <input type="text" x-model="toolForm.version" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="例如：v1.2"></div>
          <div><label class="block text-xs font-medium text-slate-600 mb-1">成熟度</label>
            <select x-model="toolForm.maturity" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm"><template x-for="m in TOOL_MATURITY" :key="m"><option x-text="m"></option></template></select></div>
        </div>
        <div class="flex gap-2">
          <button @click="showToolForm = false" class="flex-1 bg-slate-100 text-slate-600 py-2 rounded-xl text-sm font-medium">取消</button>
          <button @click="saveTool()" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-sm font-medium">保存</button>
        </div>
      </div>
    </template>
  </div>
</div>

<!-- 备份与恢复 -->
<div x-show="showBackupModal" class="fixed inset-0 bg-black/40 flex items-center justify-center z-30 p-4" x-cloak>
  <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-3 shadow-xl max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center"><h3 class="font-bold text-base">备份与恢复</h3><button @click="showBackupModal = false" class="text-slate-400 text-sm">关闭</button></div>
    <p class="text-xs text-slate-400">备份文本可直接粘贴到备忘录保存。建议每月备份一次，换手机或清理数据前先备份。</p>
    <div class="grid grid-cols-2 gap-2">
      <button @click="exportFile()" class="bg-indigo-600 text-white py-2 rounded-xl text-sm font-medium">下载备份文件</button>
      <button @click="copyBackup()" class="bg-slate-100 text-slate-700 py-2 rounded-xl text-sm font-medium">复制备份文本</button>
    </div>
    <div class="border-t border-slate-100 pt-3 space-y-2">
      <label class="block text-xs font-medium text-slate-600">恢复数据：选择备份文件，或粘贴备份文本</label>
      <input type="file" accept=".json,application/json" @change="readFile($event)" class="block w-full text-xs text-slate-500">
      <textarea x-model="importText" rows="4" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-mono" placeholder="在这里粘贴备份文本..."></textarea>
      <button @click="importData()" class="w-full bg-amber-500 text-white py-2 rounded-xl text-sm font-medium">导入并覆盖当前数据</button>
    </div>
    <p class="text-xs" :class="backupMsgOk ? 'text-emerald-600' : 'text-rose-500'" x-text="backupMsg"></p>
  </div>
</div>

<!-- 新增/编辑 -->
<div x-show="showModal" class="fixed inset-0 bg-black/40 flex items-end z-20" x-cloak>
  <div class="bg-white w-full rounded-t-3xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center"><h3 class="font-bold text-base" x-text="isEditing ? '编辑内容资产' : '新增内容资产'"></h3><button @click="closeModal()" class="text-slate-400 text-sm">取消</button></div>
    <form @submit.prevent="saveItem" class="space-y-3">
      <div><label class="block text-xs font-medium text-slate-600 mb-1">标题/主题</label>
        <input type="text" x-model="form.title" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="例如：独立开发者的副业复盘"></div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1">目标平台 (可多选)</label>
        <div class="grid grid-cols-3 gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
          <template x-for="p in platforms"><label class="flex items-center gap-1.5 text-xs cursor-pointer"><input type="checkbox" :value="p.name" x-model="form.platforms" class="rounded"><span x-text="platBrand(p.name).icon + ' ' + p.name"></span></label></template>
        </div></div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1">使用/打造的工具 (可多选)</label>
        <div class="grid grid-cols-2 gap-2 bg-indigo-50/40 p-2.5 rounded-xl border border-indigo-100">
          <template x-for="t in tools"><label class="flex items-center gap-1.5 text-xs cursor-pointer"><input type="checkbox" :value="t.name" x-model="form.tools" class="rounded"><span x-text="t.name"></span></label></template>
        </div></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="block text-xs font-medium text-slate-600 mb-1">内容形式</label>
          <select x-model="form.form" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm"><option>图文</option><option>短视频</option><option>长视频</option><option>纯文字</option></select></div>
        <div><label class="block text-xs font-medium text-slate-600 mb-1">状态</label>
          <select x-model="form.status" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm"><option>想法</option><option>制作中</option><option>已发布</option></select></div>
      </div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1">来源类型</label>
        <select x-model="form.sourceType" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm"><option>原创</option><option>跨平台改编</option><option>他人参考/改写</option></select></div>
      <template x-if="form.sourceType === '他人参考/改写'">
        <div class="space-y-2 bg-amber-50/50 p-3 rounded-xl border border-amber-200">
          <label class="block text-xs font-medium text-amber-800">参考平台 (可多选)</label>
          <div class="grid grid-cols-3 gap-2">
            <template x-for="p in platforms"><label class="flex items-center gap-1.5 text-xs cursor-pointer"><input type="checkbox" :value="p.name" x-model="form.refPlatforms" class="rounded"><span x-text="platBrand(p.name).icon + ' ' + p.name"></span></label></template>
          </div>
          <label class="block text-xs font-medium text-amber-800 mt-2 mb-1">参考来源链接/出处说明</label>
          <input type="text" x-model="form.refNote" class="w-full bg-white border border-amber-200 rounded-xl px-3 py-2 text-sm" placeholder="例如：某博主爆款选题 / 原文链接">
        </div>
      </template>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="block text-xs font-medium text-slate-600 mb-1">发布日期</label><input type="date" x-model="form.publishDate" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm"></div>
        <div><label class="block text-xs font-medium text-slate-600 mb-1">当前流量/阅读量</label><input type="text" x-model="form.traffic" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="例如：1.2w"></div>
      </div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1">内容访问链接 (选填)</label>
        <input type="url" x-model="form.link" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="https://..."></div>
      <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-medium text-sm mt-2" x-text="isEditing ? '确认修改' : '保存到内容库'"></button>
    </form>
  </div>
</div>

<script>
// 存储 key 请保持不变，改了就读不到旧数据
const KEYS = { platforms: 'content_platforms', tools: 'content_tools', items: 'content_items_v3' };
const DEFAULT_PLATFORMS = ["抖音","小红书","视频号","公众号","B站","YouTube","微博","知乎","即刻","Twitter/X"];

// 平台品牌样式：卡片上按各平台官方风格（品牌色 + 图标）展示
const PLATFORM_BRANDS = {
  '抖音':    { icon:'🎵', fg:'#ffffff', bg:'#161823' },
  '小红书':  { icon:'📕', fg:'#ffffff', bg:'#ff2442' },
  '视频号':  { icon:'📹', fg:'#ffffff', bg:'#07c160' },
  '公众号':  { icon:'💬', fg:'#ffffff', bg:'#07c160' },
  'B站':     { icon:'📺', fg:'#ffffff', bg:'#fb7299' },
  '哔哩哔哩': { icon:'📺', fg:'#ffffff', bg:'#fb7299' },
  'bilibili':{ icon:'📺', fg:'#ffffff', bg:'#fb7299' },
  'YouTube': { icon:'▶️', fg:'#ffffff', bg:'#ff0000' },
  'youtube': { icon:'▶️', fg:'#ffffff', bg:'#ff0000' },
  '微博':    { icon:'🔥', fg:'#ffffff', bg:'#e6162d' },
  '知乎':    { icon:'💡', fg:'#ffffff', bg:'#0066ff' },
  '快手':    { icon:'⚡', fg:'#ffffff', bg:'#ff6a00' },
  '即刻':    { icon:'💛', fg:'#3a2e00', bg:'#ffe411' },
  'Twitter/X':{ icon:'✖️', fg:'#ffffff', bg:'#000000' },
  'X':       { icon:'✖️', fg:'#ffffff', bg:'#000000' },
  'twitter': { icon:'✖️', fg:'#ffffff', bg:'#000000' },
  '今日头条': { icon:'📰', fg:'#ffffff', bg:'#f04142' },
  '头条':    { icon:'📰', fg:'#ffffff', bg:'#f04142' },
  '百家号':  { icon:'ⓑ', fg:'#ffffff', bg:'#2932e1' },
};
const FORM_ICONS = { '图文':'📝', '短视频':'🎬', '长视频':'🎥', '纯文字':'✍️' };
const PLATFORM_SOURCES = ['全部自创','自创为主','搬运改编为主','纯搬运'];
const TOOL_MATURITY = ['想法','开发中','可用','成熟'];
const MATURITY_CLASS = { '想法':'bg-slate-100 text-slate-600', '开发中':'bg-amber-50 text-amber-700', '可用':'bg-emerald-50 text-emerald-700', '成熟':'bg-indigo-50 text-indigo-700' };
function platBrand(name) {
  const k = String(name || '').trim();
  if (PLATFORM_BRANDS[k]) return PLATFORM_BRANDS[k];
  const lk = k.toLowerCase();
  if (PLATFORM_BRANDS[lk]) return PLATFORM_BRANDS[lk];
  // 模糊匹配：名称里包含已知平台关键词（如“微信视频号”、“公众号-频谱华章”）
  const keys = Object.keys(PLATFORM_BRANDS).sort((a, b) => b.length - a.length);
  for (const key of keys) { if (key.length >= 2 && k.includes(key)) return PLATFORM_BRANDS[key]; }
  return { icon:'🌐', fg:'#475569', bg:'#eef2f7' };
}
function formIcon(f) { return FORM_ICONS[f] || '📄'; }
// 把 "1.7w" / "3万" / "1.2k" / "50" 解析成数字，用于画趋势
function parseTraffic(s) {
  const m = String(s || '').match(/([\d.]+)\s*(w|W|万|k|K|千)?/);
  if (!m) return null;
  const n = parseFloat(m[1]);
  if (isNaN(n)) return null;
  const u = (m[2] || '').toLowerCase();
  const mult = (u === 'w' || u === '万') ? 10000 : (u === 'k' || u === '千') ? 1000 : 1;
  return n * mult;
}
// 热度历史 → 图表数据（取最近12个点，横轴为时间）
function trendChart(hist) {
  const pts = (hist || []).filter(h => typeof h.v === 'number' && !isNaN(h.v)).slice(-12);
  if (pts.length < 2) return null;
  const W = 120, H = 40, P = 5;
  const vs = pts.map(h => h.v);
  const min = Math.min.apply(null, vs), max = Math.max.apply(null, vs);
  const span = (max - min) || 1;
  const X = i => (P + i / (pts.length - 1) * (W - 2 * P)).toFixed(1);
  const Y = v => (P + (1 - (v - min) / span) * (H - 2 * P)).toFixed(1);
  const line = pts.map((h, i) => X(i) + ',' + Y(h.v)).join(' ');
  return {
    line: line,
    area: X(0) + ',' + H + ' ' + line + ' ' + X(pts.length - 1) + ',' + H,
    dots: pts.map((h, i) => ({ x: X(i), y: Y(h.v) })),
    first: pts[0], last: pts[pts.length - 1],
    delta: trendDelta(pts) || { up: true, txt: '' }
  };
}
// 图表数据 → SVG innerHTML（折线 + 面积 + 数据点）
function trendSvg(hist) {
  const c = trendChart(hist);
  if (!c) return '';
  const dots = c.dots.map(d => '<circle cx="' + d.x + '" cy="' + d.y + '" r="2" fill="#4f46e5"/>').join('');
  return '<polygon points="' + c.area + '" fill="#4f46e5" opacity="0.08"/>'
       + '<polyline points="' + c.line + '" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
       + dots;
}
// 最新一次相对上一次的变化
function trendDelta(hist) {
  const pts = (hist || []).filter(h => typeof h.v === 'number' && !isNaN(h.v));
  if (pts.length < 2) return null;
  const a = pts[pts.length - 2].v, b = pts[pts.length - 1].v;
  if (!a) return null;
  const pct = (b - a) / a * 100;
  return { up: b >= a, txt: (b >= a ? '▲' : '▼') + ' ' + Math.abs(pct).toFixed(0) + '%' };
}
// ---- 数据结构升级：平台/工具从纯字符串升级为档案对象，老数据自动迁移 ----
// "微信视频号（智慧、哲理等内容）" 会自动拆成 名称+运营内容
function normalizePlatforms(list) {
  return (list || []).map(p => {
    if (typeof p === 'string') {
      const m = p.match(/^(.+?)（(.+?)）$/);
      return { name: (m ? m[1] : p).trim(), topics: m ? m[2].trim() : '', source: '全部自创', note: '' };
    }
    return { name: p.name || '', topics: p.topics || '', source: p.source || '全部自创', note: p.note || '' };
  }).filter(p => p.name);
}
function normalizeTools(list) {
  return (list || []).map(t => typeof t === 'string'
    ? { name: t, func: '', version: '', maturity: '可用' }
    : { name: t.name || '', func: t.func || '', version: t.version || '', maturity: t.maturity || '可用' }
  ).filter(t => t.name);
}
// 老条目的 traffic 字符串转成带时间的热度历史
function normalizeTraffic(item) {
  if (Array.isArray(item.trafficHistory) && item.trafficHistory.length) return item.trafficHistory;
  const t = String(item.traffic || '').trim();
  if (!t) return [];
  return [{ d: item.publishDate || item.createdAt || new Date().toISOString().split('T')[0], v: parseTraffic(t), label: t }];
}
const DEFAULT_TOOLS = ["视频提取音频","文字生成图片","音频转文字","文字转音频"];

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { alert('保存失败：浏览器存储不可用'); }
}
const blankForm = (p) => ({ title:'', platforms:[p || '小红书'], tools:[], form:'图文', status:'想法', sourceType:'原创', refPlatforms:[], refNote:'', publishDate:'', traffic:'', link:'' });

function contentApp() {
  return {
    showModal:false, showPlatformModal:false, showToolModal:false, showBackupModal:false,
    showPlatformForm:false, showToolForm:false,
    isEditing:false, editId:null, filterStatus:'全部',
    editingPlatformIdx:-1, editingToolIdx:-1,
    platformForm:{ name:'', topics:'', source:'全部自创', note:'' },
    toolForm:{ name:'', func:'', version:'', maturity:'可用' },
    importText:'', backupMsg:'', backupMsgOk:true,
    platforms: load(KEYS.platforms, DEFAULT_PLATFORMS),
    tools: load(KEYS.tools, DEFAULT_TOOLS),
    items: load(KEYS.items, []),
    form: blankForm(),

    // 启动时自动迁移老数据：平台/工具字符串→档案对象，traffic→带时间的热度历史
    init() {
      this.platforms = normalizePlatforms(this.platforms);
      this.tools = normalizeTools(this.tools);
      this.items.forEach(it => { it.trafficHistory = normalizeTraffic(it); });
      save(KEYS.platforms, this.platforms); save(KEYS.tools, this.tools); save(KEYS.items, this.items);
    },

    get filteredItems() { return this.filterStatus === '全部' ? this.items : this.items.filter(i => i.status === this.filterStatus); },

    // ===== 平台档案 =====
    openPlatformForm(p, idx) {
      this.editingPlatformIdx = (idx === undefined || idx === null) ? -1 : idx;
      this.platformForm = p ? { name:p.name||'', topics:p.topics||'', source:p.source||'全部自创', note:p.note||'' }
                            : { name:'', topics:'', source:'全部自创', note:'' };
      this.showPlatformForm = true;
    },
    savePlatform() {
      const f = { name:this.platformForm.name.trim(), topics:this.platformForm.topics.trim(), source:this.platformForm.source, note:this.platformForm.note.trim() };
      if (!f.name) { alert('请填写平台名称'); return; }
      if (this.platforms.some((p, i) => p.name === f.name && i !== this.editingPlatformIdx)) { alert('已存在同名平台'); return; }
      if (this.editingPlatformIdx >= 0) {
        const oldName = this.platforms[this.editingPlatformIdx].name;
        this.platforms[this.editingPlatformIdx] = f;
        if (oldName && oldName !== f.name) { // 改名后同步更新内容里的引用
          this.items.forEach(it => {
            if (it.platforms) it.platforms = it.platforms.map(n => n === oldName ? f.name : n);
            if (it.refPlatforms) it.refPlatforms = it.refPlatforms.map(n => n === oldName ? f.name : n);
          });
          save(KEYS.items, this.items);
        }
      } else { this.platforms.push(f); }
      save(KEYS.platforms, this.platforms);
      this.showPlatformForm = false;
    },
    removePlatform(i) {
      const name = this.platforms[i] && this.platforms[i].name;
      if (!confirm('确定删除「' + name + '」吗？相关内容的平台标记会一并清除。')) return;
      this.platforms.splice(i, 1);
      this.items.forEach(it => {
        if (it.platforms) it.platforms = it.platforms.filter(n => n !== name);
        if (it.refPlatforms) it.refPlatforms = it.refPlatforms.filter(n => n !== name);
      });
      save(KEYS.platforms, this.platforms); save(KEYS.items, this.items);
    },

    // ===== 工具档案 =====
    openToolForm(t, idx) {
      this.editingToolIdx = (idx === undefined || idx === null) ? -1 : idx;
      this.toolForm = t ? { name:t.name||'', func:t.func||'', version:t.version||'', maturity:t.maturity||'可用' }
                        : { name:'', func:'', version:'', maturity:'可用' };
      this.showToolForm = true;
    },
    saveTool() {
      const f = { name:this.toolForm.name.trim(), func:this.toolForm.func.trim(), version:this.toolForm.version.trim(), maturity:this.toolForm.maturity };
      if (!f.name) { alert('请填写工具名称'); return; }
      if (this.tools.some((t, i) => t.name === f.name && i !== this.editingToolIdx)) { alert('已存在同名工具'); return; }
      if (this.editingToolIdx >= 0) {
        const oldName = this.tools[this.editingToolIdx].name;
        this.tools[this.editingToolIdx] = f;
        if (oldName && oldName !== f.name) {
          this.items.forEach(it => { if (it.tools) it.tools = it.tools.map(n => n === oldName ? f.name : n); });
          save(KEYS.items, this.items);
        }
      } else { this.tools.push(f); }
      save(KEYS.tools, this.tools);
      this.showToolForm = false;
    },
    removeTool(i) {
      const name = this.tools[i] && this.tools[i].name;
      if (!confirm('确定删除「' + name + '」吗？相关内容的工具标记会一并清除。')) return;
      this.tools.splice(i, 1);
      this.items.forEach(it => { if (it.tools) it.tools = it.tools.filter(n => n !== name); });
      save(KEYS.tools, this.tools); save(KEYS.items, this.items);
    },
    maturityClass(m) { return MATURITY_CLASS[m] || MATURITY_CLASS['想法']; },

    // ===== 热度记录：每次更新都带时间戳，卡片上画趋势 =====
    stampTraffic(it, val) {
      val = (val || '').trim();
      it.trafficHistory = it.trafficHistory || [];
      const today = new Date().toISOString().split('T')[0];
      const last = it.trafficHistory[it.trafficHistory.length - 1];
      if (val && (!last || last.label !== val)) {
        const entry = { d: today, v: parseTraffic(val), label: val };
        const ex = it.trafficHistory.findIndex(h => h.d === today);
        if (ex >= 0) it.trafficHistory[ex] = entry; else it.trafficHistory.push(entry);
      }
      it.traffic = val;
    },
    quickTraffic(item) {
      const v = prompt('更新今日热度' + (item.traffic ? '（当前：' + item.traffic + '）' : ''), item.traffic || '');
      if (v === null || !v.trim()) return;
      this.stampTraffic(item, v);
      save(KEYS.items, this.items);
    },

    openModal() { this.isEditing=false; this.editId=null; const pn = this.platforms[0] && this.platforms[0].name; this.form=blankForm(pn || '小红书'); this.showModal=true; },
    editItem(item) {
      this.isEditing=true; this.editId=item.id;
      this.form = { ...blankForm(), ...item, platforms: item.platforms || [item.platform || '小红书'], tools: item.tools || [], refPlatforms: item.refPlatforms || [] };
      this.showModal=true;
    },
    closeModal() { this.showModal=false; },
    saveItem() {
      if (this.isEditing) {
        this.items = this.items.map(i => {
          if (i.id !== this.editId) return i;
          const it = { ...i, ...this.form };
          this.stampTraffic(it, this.form.traffic);
          return it;
        });
      } else {
        const it = { id: Date.now(), createdAt: new Date().toISOString().split('T')[0], ...this.form };
        this.stampTraffic(it, this.form.traffic);
        this.items.unshift(it);
      }
      save(KEYS.items, this.items); this.closeModal();
    },
    deleteItem(id) { if (confirm('确定删除这条内容吗？')) { this.items = this.items.filter(i => i.id !== id); save(KEYS.items, this.items); } },

    // ===== 备份与恢复 =====
    openBackup() { this.backupMsg=''; this.importText=''; this.showBackupModal=true; },
    backupString() {
      return JSON.stringify({ app:'content-matrix', name:'创作矩阵', version:2, exportedAt:new Date().toISOString(), data:{ platforms:this.platforms, tools:this.tools, items:this.items } }, null, 2);
    },
    exportFile() {
      const blob = new Blob([this.backupString()], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'content-matrix-' + new Date().toISOString().split('T')[0] + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      this.msg('已生成备份文件（共 ' + this.items.length + ' 条内容）', true);
    },
    async copyBackup() {
      try { await navigator.clipboard.writeText(this.backupString()); this.msg('已复制，去备忘录粘贴保存', true); }
      catch (e) { this.importText = this.backupString(); this.msg('已填入下方文本框，长按全选复制', false); }
    },
    readFile(ev) {
      const f = ev.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { this.importText = r.result; this.msg('文件已读取，点击“导入并覆盖”完成恢复', true); };
      r.readAsText(f);
    },
    importData() {
      let d;
      try { d = JSON.parse(this.importText); } catch (e) { return this.msg('格式不对：请粘贴完整的备份文本', false); }
      // 兼容旧版备份（无 data 包装）与新版备份（data:{platforms,tools,items}）
      const src = (d && d.data && Array.isArray(d.data.items)) ? d.data : d;
      if (!src || !Array.isArray(src.items)) return this.msg('这不是有效的备份：缺少内容列表', false);
      if (!confirm('将用备份覆盖当前 ' + this.items.length + ' 条内容，继续吗？')) return;
      this.items = src.items;
      this.items.forEach(it => { it.trafficHistory = normalizeTraffic(it); });
      if (Array.isArray(src.platforms)) this.platforms = normalizePlatforms(src.platforms);
      if (Array.isArray(src.tools)) this.tools = normalizeTools(src.tools);
      save(KEYS.items, this.items); save(KEYS.platforms, this.platforms); save(KEYS.tools, this.tools);
      this.importText = ''; this.msg('已恢复 ' + this.items.length + ' 条内容', true);
    },
    msg(t, ok) { this.backupMsg = t; this.backupMsgOk = ok; }
  };
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
