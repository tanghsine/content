<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>副业内容矩阵与工具流管理</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 Alpine.js 处理简单交互 -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12" x-data="contentApp()">

    <!-- 顶部导航 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="font-bold text-lg text-slate-900">🚀 副业内容与工具流</h1>
            <div class="flex items-center gap-1.5">
                <!-- 平台管理按钮 -->
                <button @click="showPlatformModal = true" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg font-medium transition">
                    ⚙️ 平台
                </button>
                <!-- 工具管理按钮 -->
                <button @click="showToolModal = true" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg font-medium transition">
                    🛠️️ 工具箱
                </button>
            </div>
        </div>
    </header>

    <!-- 主体容器 -->
    <main class="max-w-md mx-auto px-4 mt-4 space-y-4">

        <!-- 快捷操作区 -->
        <div class="flex gap-2">
            <button @click="openModal()" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl font-medium text-sm shadow-sm active:scale-98 transition">
                + 新增内容资产
            </button>
        </div>

        <!-- 数据概览小卡片 (点击可进行状态筛选) -->
        <div class="grid grid-cols-4 gap-2">
            <div @click="filterStatus = '全部'" class="bg-white p-2.5 rounded-xl border text-center cursor-pointer transition"
                :class="filterStatus === '全部' ? 'border-indigo-600 ring-1 ring-indigo-600 bg-indigo-50/30' : 'border-slate-200'">
                <div class="text-[10px] text-slate-400">全部</div>
                <div class="text-base font-bold text-slate-800" x-text="items.length">0</div>
            </div>
            <div @click="filterStatus = '已发布'" class="bg-white p-2.5 rounded-xl border text-center cursor-pointer transition"
                :class="filterStatus === '已发布' ? 'border-emerald-600 ring-1 ring-emerald-600 bg-emerald-50/30' : 'border-slate-200'">
                <div class="text-[10px] text-slate-400">已发布</div>
                <div class="text-base font-bold text-emerald-600" x-text="items.filter(i => i.status === '已发布').length">0</div>
            </div>
            <div @click="filterStatus = '制作中'" class="bg-white p-2.5 rounded-xl border text-center cursor-pointer transition"
                :class="filterStatus === '制作中' ? 'border-amber-600 ring-1 ring-amber-600 bg-amber-50/30' : 'border-slate-200'">
                <div class="text-[10px] text-slate-400">制作中</div>
                <div class="text-base font-bold text-amber-600" x-text="items.filter(i => i.status === '制作中').length">0</div>
            </div>
            <div @click="filterStatus = '想法'" class="bg-white p-2.5 rounded-xl border text-center cursor-pointer transition"
                :class="filterStatus === '想法' ? 'border-slate-600 ring-1 ring-slate-600 bg-slate-100/50' : 'border-slate-200'">
                <div class="text-[10px] text-slate-400">想法</div>
                <div class="text-base font-bold text-slate-600" x-text="items.filter(i => i.status === '想法').length">0</div>
            </div>
        </div>

        <!-- 内容库列表 -->
        <div class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="font-semibold text-sm text-slate-600">内容资产台账</h2>
                <span class="text-xs text-slate-400" x-text="'当前筛选: ' + filterStatus"></span>
            </div>
            
            <template x-if="filteredItems.length === 0">
                <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-8 text-center text-slate-400 text-sm">
                    没有找到符合条件的内容资产
                </div>
            </template>

            <template x-for="item in filteredItems" :key="item.id">
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs space-y-2.5">
                    <div class="flex justify-between items-start">
                        <span class="text-xs px-2 py-0.5 rounded-md font-medium"
                            :class="{
                                'bg-emerald-50 text-emerald-700': item.status === '已发布',
                                'bg-amber-50 text-amber-700': item.status === '制作中',
                                'bg-slate-100 text-slate-600': item.status === '想法'
                            }" x-text="item.status"></span>
                        
                        <div class="flex items-center gap-1.5">
                            <button @click="editItem(item)" class="text-slate-400 hover:text-indigo-600 text-xs px-2 py-0.5 bg-slate-50 rounded border border-slate-200">编辑</button>
                            <button @click="deleteItem(item.id)" class="text-slate-300 hover:text-rose-500 text-xs px-1.5 py-0.5">✕</button>
                        </div>
                    </div>
                    
                    <h3 class="font-medium text-slate-900 text-sm" x-text="item.title"></h3>

                    <!-- 目标平台标签展示 -->
                    <div class="flex flex-wrap gap-1">
                        <template x-for="plat in item.platforms">
                            <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full" x-text="plat"></span>
                        </template>
                    </div>

                    <!-- 使用的工具标签展示 -->
                    <template x-if="item.tools && item.tools.length > 0">
                        <div class="flex flex-wrap gap-1 pt-1">
                            <template x-for="t in item.tools">
                                <span class="text-[10px] bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md border border-indigo-100" x-text="'🛠️ ' + t"></span>
                            </template>
                        </div>
                    </template>

                    <!-- 底部关键指标与日期 -->
                    <div class="grid grid-cols-3 gap-1 pt-2 border-t border-slate-100 text-[11px] text-slate-500">
                        <div>
                            <span class="text-slate-400 block text-[10px]">创建</span>
                            <span x-text="item.createdAt || '-'"></span>
                        </div>
                        <div>
                            <span class="text-slate-400 block text-[10px]">发布</span>
                            <span x-text="item.publishDate || '未发布'"></span>
                        </div>
                        <div class="text-right">
                            <span class="text-slate-400 block text-[10px]">当前流量</span>
                            <span class="font-semibold text-indigo-600" x-text="item.traffic || '0'"></span>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <!-- 弹窗1：平台管理弹窗 -->
    <div x-show="showPlatformModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center z-30 p-4" x-cloak>
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-base">自定义管理发布平台</h3>
                <button @click="showPlatformModal = false" class="text-slate-400 text-sm">关闭</button>
            </div>
            <div class="flex gap-2">
                <input type="text" x-model="newPlatformName" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="输入新平台名称...">
                <button @click="addPlatform()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium">添加</button>
            </div>
            <div class="space-y-1.5 max-h-60 overflow-y-auto">
                <template x-for="(p, index) in platforms" :key="p">
                    <div class="flex justify-between items-center bg-slate-50 px-3 py-2 rounded-xl border border-slate-100 text-sm">
                        <span x-text="p"></span>
                        <button @click="removePlatform(index)" class="text-slate-400 hover:text-rose-500 text-xs">删除</button>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- 弹窗2：工具箱管理弹窗 -->
    <div x-show="showToolModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center z-30 p-4" x-cloak>
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-base">自定义生产力工具箱</h3>
                <button @click="showToolModal = false" class="text-slate-400 text-sm">关闭</button>
            </div>
            <p class="text-xs text-slate-400">管理你已有或正在打造的自动化工具，方便在内容创作时进行关联标记。</p>
            <div class="flex gap-2">
                <input type="text" x-model="newToolName" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="例如：文字生成图片...">
                <button @click="addTool()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium">添加</button>
            </div>
            <div class="space-y-1.5 max-h-60 overflow-y-auto">
                <template x-for="(t, index) in tools" :key="t">
                    <div class="flex justify-between items-center bg-slate-50 px-3 py-2 rounded-xl border border-slate-100 text-sm">
                        <span x-text="'🛠️ ' + t"></span>
                        <button @click="removeTool(index)" class="text-slate-400 hover:text-rose-500 text-xs">删除</button>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- 弹窗3：新增/编辑内容表单 -->
    <div x-show="showModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-end z-20" x-cloak>
        <div class="bg-white w-full rounded-t-3xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-base" x-text="isEditing ? '编辑内容资产' : '新增内容资产'"></h3>
                <button @click="closeModal()" class="text-slate-400 text-sm">取消</button>
            </div>

            <form @submit.prevent="saveItem" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">标题/主题</label>
                    <input type="text" x-model="form.title" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-indigo-600" placeholder="例如：独立开发者的副业复盘">
                </div>

                <!-- 目标平台多选 -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">目标平台 (可多选)</label>
                    <div class="grid grid-cols-3 gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                        <template x-for="p in platforms">
                            <label class="flex items-center gap-1.5 text-xs text-slate-700 cursor-pointer">
                                <input type="checkbox" :value="p" x-model="form.platforms" class="rounded text-indigo-600 focus:ring-indigo-500">
                                <span x-text="p"></span>
                            </label>
                        </template>
                    </div>
                </div>

                <!-- 生产力工具多选 -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">使用/打造的工具 (可多选)</label>
                    <div class="grid grid-cols-2 gap-2 bg-indigo-50/40 p-2.5 rounded-xl border border-indigo-100">
                        <template x-for="t in tools">
                            <label class="flex items-center gap-1.5 text-xs text-slate-700 cursor-pointer">
                                <input type="checkbox" :value="t" x-model="form.tools" class="rounded text-indigo-600 focus:ring-indigo-500">
                                <span x-text="t"></span>
                            </label>
                        </template>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">内容形式</label>
                        <select x-model="form.form" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                            <option>图文</option>
                            <option>短视频</option>
                            <option>长视频</option>
                            <option>纯文字</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">状态</label>
                        <select x-model="form.status" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                            <option>想法</option>
                            <option>制作中</option>
                            <option>已发布</option>
                        </select>
                    </div>
                </div>

                <!-- 来源类型与参考源多选 -->
                <div class="space-y-2">
                    <label class="block text-xs font-medium text-slate-600">来源类型</label>
                    <select x-model="form.sourceType" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                        <option>原创</option>
                        <option>跨平台改编</option>
                        <option>他人参考/改写</option>
                    </select>
                </div>

                <template x-if="form.sourceType === '他人参考/改写'">
                    <div class="space-y-2 bg-amber-50/50 p-3 rounded-xl border border-amber-200">
                        <label class="block text-xs font-medium text-amber-800">参考平台 (可多选)</label>
                        <div class="grid grid-cols-3 gap-2">
                            <template x-for="p in platforms">
                                <label class="flex items-center gap-1.5 text-xs text-slate-700 cursor-pointer">
                                    <input type="checkbox" :value="p" x-model="form.refPlatforms" class="rounded text-amber-600">
                                    <span x-text="p"></span>
                                </label>
                            </template>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-amber-800 mt-2 mb-1">参考来源链接/出处说明</label>
                            <input type="text" x-model="form.refNote" class="w-full bg-white border border-amber-200 rounded-xl px-3 py-2 text-sm" placeholder="例如：某博主爆款选题 / 原文链接">
                        </div>
                    </div>
                </template>

                <!-- 日期与流量追踪 -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">发布日期</label>
                        <input type="date" x-model="form.publishDate" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">当前流量/阅读量</label>
                        <input type="text" x-model="form.traffic" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="例如：1.2w">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">内容访问链接 (选填)</label>
                    <input type="url" x-model="form.link" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="https://...">
                </div>

                <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-medium text-sm shadow-sm mt-2" x-text="isEditing ? '确认修改' : '保存到内容库'"></button>
            </form>
        </div>
    </div>

    <!-- 逻辑脚本 -->
    <script>
        function contentApp() {
            return {
                showModal: false,
                showPlatformModal: false,
                showToolModal: false,
                isEditing: false,
                editId: null,
                filterStatus: '全部',
                newPlatformName: '',
                newToolName: '',
                platforms: JSON.parse(localStorage.getItem('content_platforms') || '["小红书", "YouTube", "即刻", "Twitter/X", "视频号", "公众号"]'),
                tools: JSON.parse(localStorage.getItem('content_tools') || '["视频提取音频", "文字生成图片", "音频转文字", "文字转音频"]'),
                items: JSON.parse(localStorage.getItem('content_items_v3') || '[]'),
                form: {
                    title: '',
                    platforms: ['小红书'],
                    tools: [],
                    form: '图文',
                    status: '想法',
                    sourceType: '原创',
                    refPlatforms: [],
                    refNote: '',
                    publishDate: '',
                    traffic: '',
                    link: ''
                },
                get filteredItems() {
                    if (this.filterStatus === '全部') return this.items;
                    return this.items.filter(i => i.status === this.filterStatus);
                },
                addPlatform() {
                    if (this.newPlatformName.trim() && !this.platforms.includes(this.newPlatformName.trim())) {
                        this.platforms.push(this.newPlatformName.trim());
                        this.newPlatformName = '';
                        localStorage.setItem('content_platforms', JSON.stringify(this.platforms));
                    }
                },
                removePlatform(index) {
                    if (confirm('确定删除该平台吗？')) {
                        this.platforms.splice(index, 1);
                        localStorage.setItem('content_platforms', JSON.stringify(this.platforms));
                    }
                },
                addTool() {
                    if (this.newToolName.trim() && !this.tools.includes(this.newToolName.trim())) {
                        this.tools.push(this.newToolName.trim());
                        this.newToolName = '';
                        localStorage.setItem('content_tools', JSON.stringify(this.tools));
                    }
                },
                removeTool(index) {
                    if (confirm('确定删除该工具吗？')) {
                        this.tools.splice(index, 1);
                        localStorage.setItem('content_tools', JSON.stringify(this.tools));
                    }
                },
                openModal() {
                    this.isEditing = false;
                    this.editId = null;
                    this.form = {
                        title: '',
                        platforms: [this.platforms[0] || '小红书'],
                        tools: [],
                        form: '图文',
                        status: '想法',
                        sourceType: '原创',
                        refPlatforms: [],
                        refNote: '',
                        publishDate: '',
                        traffic: '',
                        link: ''
                    };
                    this.showModal = true;
                },
                editItem(item) {
                    this.isEditing = true;
                    this.editId = item.id;
                    this.form = {
                        title: item.title,
                        platforms: item.platforms || [item.platform || '小红书'],
                        tools: item.tools || [],
                        form: item.form,
                        status: item.status,
                        sourceType: item.sourceType,
                        refPlatforms: item.refPlatforms || [],
                        refNote: item.refNote || '',
                        publishDate: item.publishDate || '',
                        traffic: item.traffic || '',
                        link: item.link || ''
                    };
                    this.showModal = true;
                },
                closeModal() {
                    this.showModal = false;
                },
                saveItem() {
                    const today = new Date().toISOString().split('T')[0];
                    if (this.isEditing) {
                        this.items = this.items.map(i => {
                            if (i.id === this.editId) {
                                return { ...i, ...this.form };
                            }
                            return i;
                        });
                    } else {
                        const newItem = {
                            id: Date.now(),
                            createdAt: today,
                            ...this.form
                        };
                        this.items.unshift(newItem);
                    }
                    this.syncStorage();
                    this.closeModal();
                },
                deleteItem(id) {
                    if(confirm('确定删除这条内容吗？')) {
                        this.items = this.items.filter(i => i.id !== id);
                        this.syncStorage();
                    }
                },
                syncStorage() {
                    localStorage.setItem('content_items_v3', JSON.stringify(this.items));
                }
            }
        }
    </script>
</body>
</html>
