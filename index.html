<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="创作矩阵">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>创作矩阵</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12" x-data="contentApp()">

<header class="bg-white border-b border-slate-200 sticky top-0 z-10">
  <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
    <h1 class="font-bold text-lg text-slate-900">🚀 创作矩阵</h1>
    <div class="flex items-center gap-1.5">
      <button @click="showPlatformModal = true" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg font-medium">⚙️ 平台</button>
      <button @click="showToolModal = true" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg font-medium">🛠️ 工具箱</button>
      <button @click="openBackup()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg font-medium">💾 备份</button>
    </div>
  </div>
</header>

<main class="max-w-md mx-auto px-4 mt-4 space-y-4">
  <button @click="openModal()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-medium text-sm shadow-sm">+ 新增内容资产</button>

  <div class="grid grid-cols-4 gap-2">
    <div @click="filterStatus = '全部'" class="bg-white p-2.5 rounded-xl border text-center cursor-pointer" :class="filterStatus === '全部' ? 'border-indigo-600 ring-1 ring-indigo-600 bg-indigo-50/30' : 'border-slate-200'">
      <div class="text-[10px] text-slate-400">全部</div><div class="text-base font-bold" x-text="items.length">0</div></div>
    <div @click="filterStatus = '已发布'" class="bg-white p-2.5 rounded-xl border text-center cursor-pointer" :class="filterStatus === '已发布' ? 'border-emerald-600 ring-1 ring-emerald-600 bg-emerald-50/30' : 'border-slate-200'">
      <div class="text-[10px] text-slate-400">已发布</div><div class="text-base font-bold text-emerald-600" x-text="items.filter(i => i.status === '已发布').length">0</div></div>
    <div @click="filterStatus = '制作中'" class="bg-white p-2.5 rounded-xl border text-center cursor-pointer" :class="filterStatus === '制作中' ? 'border-amber-600 ring-1 ring-amber-600 bg-amber-50/30' : 'border-slate-200'">
      <div class="text-[10px] text-slate-400">制作中</div><div class="text-base font-bold text-amber-600" x-text="items.filter(i => i.status === '制作中').length">0</div></div>
    <div @click="filterStatus = '想法'" class="bg-white p-2.5 rounded-xl border text-center cursor-pointer" :class="filterStatus === '想法' ? 'border-slate-600 ring-1 ring-slate-600 bg-slate-100/50' : 'border-slate-200'">
      <div class="text-[10px] text-slate-400">想法</div><div class="text-base font-bold text-slate-600" x-text="items.filter(i => i.status === '想法').length">0</div></div>
  </div>

  <div class="space-y-3">
    <div class="flex justify-between items-center px-1">
      <h2 class="font-semibold text-sm text-slate-600">内容资产台账</h2>
      <span class="text-xs text-slate-400" x-text="'当前筛选: ' + filterStatus"></span>
    </div>
    <div class="px-1 -mt-1 text-xs text-slate-400" x-text="'本月新增 ' + items.filter(i => (i.createdAt||'').slice(0,7) === new Date().toISOString().slice(0,7)).length + ' 条 · 已发布 ' + items.filter(i => i.status === '已发布').length + ' 条'"></div>

    <template x-if="filteredItems.length === 0">
      <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-8 text-center text-slate-400 text-sm">这里空空如也，有新想法时点上方 ＋ 记录下来吧</div>
    </template>

    <template x-for="item in filteredItems" :key="item.id">
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs space-y-2.5">
        <div class="flex justify-between items-start">
          <span class="text-xs px-2 py-0.5 rounded-md font-medium" :class="{'bg-emerald-50 text-emerald-700': item.status === '已发布','bg-amber-50 text-amber-700': item.status === '制作中','bg-slate-100 text-slate-600': item.status === '想法'}" x-text="item.status"></span>
          <div class="flex items-center gap-1.5">
            <button @click="editItem(item)" class="text-slate-400 text-xs px-2 py-0.5 bg-slate-50 rounded border border-slate-200">编辑</button>
            <button @click="deleteItem(item.id)" class="text-slate-300 text-xs px-1.5 py-0.5">✕</button>
          </div>
        </div>
        <h3 class="font-medium text-slate-900 text-sm" x-text="item.title"></h3>
        <div class="flex items-center gap-1.5 flex-wrap">
          <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md" x-text="formIcon(item.form) + ' ' + (item.form || '图文')"></span>
          <template x-if="item.link"><a :href="item.link" target="_blank" rel="noopener" class="text-[10px] text-indigo-600 underline">🔗 原文链接</a></template>
        </div>
        <div class="flex flex-wrap items-center gap-1.5">
          <span class="text-[10px] text-slate-400">发布平台</span>
          <template x-for="plat in (item.platforms || (item.platform ? [item.platform] : []))" :key="plat">
            <span class="text-[10px] font-medium px-2 py-0.5 rounded-full inline-flex items-center gap-1"
              :style="'background:' + platBrand(plat).bg + ';color:' + platBrand(plat).fg">
              <span x-text="platBrand(plat).icon"></span><span x-text="plat"></span>
            </span>
          </template>
        </div>
        <template x-if="item.refPlatforms && item.refPlatforms.length">
          <div class="flex flex-wrap items-center gap-1.5 bg-amber-50/60 border border-amber-100 rounded-xl px-2.5 py-1.5">
            <span class="text-[10px] text-amber-700 font-medium">📌 参考</span>
            <template x-for="plat in item.refPlatforms" :key="plat">
              <span class="text-[10px] font-medium px-2 py-0.5 rounded-full inline-flex items-center gap-1"
                :style="'background:' + platBrand(plat).bg + ';color:' + platBrand(plat).fg">
                <span x-text="platBrand(plat).icon"></span><span x-text="plat"></span>
              </span>
            </template>
            <template x-if="item.refNote"><span class="text-[10px] text-slate-500 w-full" x-text="'出处：' + item.refNote"></span></template>
          </div>
        </template>
        <template x-if="item.tools && item.tools.length > 0">
          <div class="flex flex-wrap gap-1 pt-1">
            <template x-for="t in item.tools"><span class="text-[10px] bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md border border-indigo-100" x-text="'🛠️ ' + t"></span></template>
          </div>
        </template>
        <div class="grid grid-cols-3 gap-1 pt-2 border-t border-slate-100 text-[11px] text-slate-500">
          <div><span class="text-slate-400 block text-[10px]">创建</span><span x-text="item.createdAt || '-'"></span></div>
          <div><span class="text-slate-400 block text-[10px]">发布</span><span x-text="item.publishDate || '未发布'"></span></div>
          <div class="text-right"><span class="text-slate-400 block text-[10px]">当前流量</span><span class="font-semibold text-indigo-600" x-text="item.traffic || '0'"></span></div>
        </div>
      </div>
    </template>
  </div>
</main>

<!-- 平台管理 -->
<div x-show="showPlatformModal" class="fixed inset-0 bg-black/40 flex items-center justify-center z-30 p-4" x-cloak>
  <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-xl">
    <div class="flex justify-between items-center"><h3 class="font-bold text-base">自定义管理发布平台</h3><button @click="showPlatformModal = false" class="text-slate-400 text-sm">关闭</button></div>
    <div class="flex gap-2">
      <input type="text" x-model="newPlatformName" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="输入新平台名称...">
      <button @click="addPlatform()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium">添加</button>
    </div>
    <div class="space-y-1.5 max-h-60 overflow-y-auto">
      <template x-for="(p, index) in platforms" :key="p">
        <div class="flex justify-between items-center bg-slate-50 px-3 py-2 rounded-xl border border-slate-100 text-sm">
          <span class="text-xs font-medium px-2 py-0.5 rounded-full inline-flex items-center gap-1" :style="'background:' + platBrand(p).bg + ';color:' + platBrand(p).fg"><span x-text="platBrand(p).icon"></span><span x-text="p"></span></span>
          <button @click="removePlatform(index)" class="text-slate-400 text-xs">删除</button>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- 工具箱 -->
<div x-show="showToolModal" class="fixed inset-0 bg-black/40 flex items-center justify-center z-30 p-4" x-cloak>
  <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-xl">
    <div class="flex justify-between items-center"><h3 class="font-bold text-base">自定义生产力工具箱</h3><button @click="showToolModal = false" class="text-slate-400 text-sm">关闭</button></div>
    <p class="text-xs text-slate-400">管理你已有或正在打造的自动化工具，方便在内容创作时关联标记。</p>
    <div class="flex gap-2">
      <input type="text" x-model="newToolName" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="例如：文字生成图片...">
      <button @click="addTool()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium">添加</button>
    </div>
    <div class="space-y-1.5 max-h-60 overflow-y-auto">
      <template x-for="(t, index) in tools" :key="t">
        <div class="flex justify-between items-center bg-slate-50 px-3 py-2 rounded-xl border border-slate-100 text-sm"><span x-text="'🛠️ ' + t"></span><button @click="removeTool(index)" class="text-slate-400 text-xs">删除</button></div>
      </template>
    </div>
  </div>
</div>

<!-- 备份与恢复 -->
<div x-show="showBackupModal" class="fixed inset-0 bg-black/40 flex items-center justify-center z-30 p-4" x-cloak>
  <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-3 shadow-xl max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center"><h3 class="font-bold text-base">备份与恢复</h3><button @click="showBackupModal = false" class="text-slate-400 text-sm">关闭</button></div>
    <p class="text-xs text-slate-400">备份文本可直接粘贴到备忘录保存。建议每月备份一次，换手机或清理数据前先备份。</p>
    <div class="grid grid-cols-2 gap-2">
      <button @click="exportFile()" class="bg-indigo-600 text-white py-2 rounded-xl text-sm font-medium">下载备份文件</button>
      <button @click="copyBackup()" class="bg-slate-100 text-slate-700 py-2 rounded-xl text-sm font-medium">复制备份文本</button>
    </div>
    <div class="border-t border-slate-100 pt-3 space-y-2">
      <label class="block text-xs font-medium text-slate-600">恢复数据：选择备份文件，或粘贴备份文本</label>
      <input type="file" accept=".json,application/json" @change="readFile($event)" class="block w-full text-xs text-slate-500">
      <textarea x-model="importText" rows="4" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-mono" placeholder="在这里粘贴备份文本..."></textarea>
      <button @click="importData()" class="w-full bg-amber-500 text-white py-2 rounded-xl text-sm font-medium">导入并覆盖当前数据</button>
    </div>
    <p class="text-xs" :class="backupMsgOk ? 'text-emerald-600' : 'text-rose-500'" x-text="backupMsg"></p>
  </div>
</div>

<!-- 新增/编辑 -->
<div x-show="showModal" class="fixed inset-0 bg-black/40 flex items-end z-20" x-cloak>
  <div class="bg-white w-full rounded-t-3xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center"><h3 class="font-bold text-base" x-text="isEditing ? '编辑内容资产' : '新增内容资产'"></h3><button @click="closeModal()" class="text-slate-400 text-sm">取消</button></div>
    <form @submit.prevent="saveItem" class="space-y-3">
      <div><label class="block text-xs font-medium text-slate-600 mb-1">标题/主题</label>
        <input type="text" x-model="form.title" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="例如：独立开发者的副业复盘"></div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1">目标平台 (可多选)</label>
        <div class="grid grid-cols-3 gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
          <template x-for="p in platforms"><label class="flex items-center gap-1.5 text-xs cursor-pointer"><input type="checkbox" :value="p" x-model="form.platforms" class="rounded"><span x-text="platBrand(p).icon + ' ' + p"></span></label></template>
        </div></div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1">使用/打造的工具 (可多选)</label>
        <div class="grid grid-cols-2 gap-2 bg-indigo-50/40 p-2.5 rounded-xl border border-indigo-100">
          <template x-for="t in tools"><label class="flex items-center gap-1.5 text-xs cursor-pointer"><input type="checkbox" :value="t" x-model="form.tools" class="rounded"><span x-text="t"></span></label></template>
        </div></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="block text-xs font-medium text-slate-600 mb-1">内容形式</label>
          <select x-model="form.form" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm"><option>图文</option><option>短视频</option><option>长视频</option><option>纯文字</option></select></div>
        <div><label class="block text-xs font-medium text-slate-600 mb-1">状态</label>
          <select x-model="form.status" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm"><option>想法</option><option>制作中</option><option>已发布</option></select></div>
      </div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1">来源类型</label>
        <select x-model="form.sourceType" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm"><option>原创</option><option>跨平台改编</option><option>他人参考/改写</option></select></div>
      <template x-if="form.sourceType === '他人参考/改写'">
        <div class="space-y-2 bg-amber-50/50 p-3 rounded-xl border border-amber-200">
          <label class="block text-xs font-medium text-amber-800">参考平台 (可多选)</label>
          <div class="grid grid-cols-3 gap-2">
            <template x-for="p in platforms"><label class="flex items-center gap-1.5 text-xs cursor-pointer"><input type="checkbox" :value="p" x-model="form.refPlatforms" class="rounded"><span x-text="platBrand(p).icon + ' ' + p"></span></label></template>
          </div>
          <label class="block text-xs font-medium text-amber-800 mt-2 mb-1">参考来源链接/出处说明</label>
          <input type="text" x-model="form.refNote" class="w-full bg-white border border-amber-200 rounded-xl px-3 py-2 text-sm" placeholder="例如：某博主爆款选题 / 原文链接">
        </div>
      </template>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="block text-xs font-medium text-slate-600 mb-1">发布日期</label><input type="date" x-model="form.publishDate" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm"></div>
        <div><label class="block text-xs font-medium text-slate-600 mb-1">当前流量/阅读量</label><input type="text" x-model="form.traffic" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="例如：1.2w"></div>
      </div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1">内容访问链接 (选填)</label>
        <input type="url" x-model="form.link" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="https://..."></div>
      <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-medium text-sm mt-2" x-text="isEditing ? '确认修改' : '保存到内容库'"></button>
    </form>
  </div>
</div>

<script>
// 存储 key 请保持不变，改了就读不到旧数据
const KEYS = { platforms: 'content_platforms', tools: 'content_tools', items: 'content_items_v3' };
const DEFAULT_PLATFORMS = ["抖音","小红书","视频号","公众号","B站","YouTube","微博","知乎","即刻","Twitter/X"];

// 平台品牌样式：卡片上按各平台官方风格（品牌色 + 图标）展示
const PLATFORM_BRANDS = {
  '抖音':    { icon:'🎵', fg:'#ffffff', bg:'#161823' },
  '小红书':  { icon:'📕', fg:'#ffffff', bg:'#ff2442' },
  '视频号':  { icon:'📹', fg:'#ffffff', bg:'#07c160' },
  '公众号':  { icon:'💬', fg:'#ffffff', bg:'#07c160' },
  'B站':     { icon:'📺', fg:'#ffffff', bg:'#fb7299' },
  '哔哩哔哩': { icon:'📺', fg:'#ffffff', bg:'#fb7299' },
  'bilibili':{ icon:'📺', fg:'#ffffff', bg:'#fb7299' },
  'YouTube': { icon:'▶️', fg:'#ffffff', bg:'#ff0000' },
  'youtube': { icon:'▶️', fg:'#ffffff', bg:'#ff0000' },
  '微博':    { icon:'🔥', fg:'#ffffff', bg:'#e6162d' },
  '知乎':    { icon:'💡', fg:'#ffffff', bg:'#0066ff' },
  '快手':    { icon:'⚡', fg:'#ffffff', bg:'#ff6a00' },
  '即刻':    { icon:'💛', fg:'#3a2e00', bg:'#ffe411' },
  'Twitter/X':{ icon:'✖️', fg:'#ffffff', bg:'#000000' },
  'X':       { icon:'✖️', fg:'#ffffff', bg:'#000000' },
  'twitter': { icon:'✖️', fg:'#ffffff', bg:'#000000' },
  '今日头条': { icon:'📰', fg:'#ffffff', bg:'#f04142' },
  '头条':    { icon:'📰', fg:'#ffffff', bg:'#f04142' },
  '百家号':  { icon:'ⓑ', fg:'#ffffff', bg:'#2932e1' },
};
const FORM_ICONS = { '图文':'📝', '短视频':'🎬', '长视频':'🎥', '纯文字':'✍️' };
function platBrand(name) {
  const k = String(name || '').trim();
  return PLATFORM_BRANDS[k] || PLATFORM_BRANDS[k.toLowerCase()] || { icon:'🌐', fg:'#475569', bg:'#eef2f7' };
}
function formIcon(f) { return FORM_ICONS[f] || '📄'; }
const DEFAULT_TOOLS = ["视频提取音频","文字生成图片","音频转文字","文字转音频"];

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { alert('保存失败：浏览器存储不可用'); }
}
const blankForm = (p) => ({ title:'', platforms:[p || '小红书'], tools:[], form:'图文', status:'想法', sourceType:'原创', refPlatforms:[], refNote:'', publishDate:'', traffic:'', link:'' });

function contentApp() {
  return {
    showModal:false, showPlatformModal:false, showToolModal:false, showBackupModal:false,
    isEditing:false, editId:null, filterStatus:'全部', newPlatformName:'', newToolName:'',
    importText:'', backupMsg:'', backupMsgOk:true,
    platforms: load(KEYS.platforms, DEFAULT_PLATFORMS),
    tools: load(KEYS.tools, DEFAULT_TOOLS),
    items: load(KEYS.items, []),
    form: blankForm(),

    get filteredItems() { return this.filterStatus === '全部' ? this.items : this.items.filter(i => i.status === this.filterStatus); },

    addPlatform() { const n = this.newPlatformName.trim(); if (n && !this.platforms.includes(n)) { this.platforms.push(n); this.newPlatformName=''; save(KEYS.platforms, this.platforms); } },
    removePlatform(i) { if (confirm('确定删除该平台吗？')) { this.platforms.splice(i,1); save(KEYS.platforms, this.platforms); } },
    addTool() { const n = this.newToolName.trim(); if (n && !this.tools.includes(n)) { this.tools.push(n); this.newToolName=''; save(KEYS.tools, this.tools); } },
    removeTool(i) { if (confirm('确定删除该工具吗？')) { this.tools.splice(i,1); save(KEYS.tools, this.tools); } },

    openModal() { this.isEditing=false; this.editId=null; this.form=blankForm(this.platforms[0]); this.showModal=true; },
    editItem(item) {
      this.isEditing=true; this.editId=item.id;
      this.form = { ...blankForm(), ...item, platforms: item.platforms || [item.platform || '小红书'], tools: item.tools || [], refPlatforms: item.refPlatforms || [] };
      this.showModal=true;
    },
    closeModal() { this.showModal=false; },
    saveItem() {
      if (this.isEditing) {
        this.items = this.items.map(i => i.id === this.editId ? { ...i, ...this.form } : i);
      } else {
        this.items.unshift({ id: Date.now(), createdAt: new Date().toISOString().split('T')[0], ...this.form });
      }
      save(KEYS.items, this.items); this.closeModal();
    },
    deleteItem(id) { if (confirm('确定删除这条内容吗？')) { this.items = this.items.filter(i => i.id !== id); save(KEYS.items, this.items); } },

    // ===== 备份与恢复 =====
    openBackup() { this.backupMsg=''; this.importText=''; this.showBackupModal=true; },
    backupString() {
      return JSON.stringify({ app:'content-matrix', name:'创作矩阵', version:2, exportedAt:new Date().toISOString(), data:{ platforms:this.platforms, tools:this.tools, items:this.items } }, null, 2);
    },
    exportFile() {
      const blob = new Blob([this.backupString()], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'content-matrix-' + new Date().toISOString().split('T')[0] + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      this.msg('已生成备份文件（共 ' + this.items.length + ' 条内容）', true);
    },
    async copyBackup() {
      try { await navigator.clipboard.writeText(this.backupString()); this.msg('已复制，去备忘录粘贴保存', true); }
      catch (e) { this.importText = this.backupString(); this.msg('已填入下方文本框，长按全选复制', false); }
    },
    readFile(ev) {
      const f = ev.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { this.importText = r.result; this.msg('文件已读取，点击“导入并覆盖”完成恢复', true); };
      r.readAsText(f);
    },
    importData() {
      let d;
      try { d = JSON.parse(this.importText); } catch (e) { return this.msg('格式不对：请粘贴完整的备份文本', false); }
      // 兼容旧版备份（无 data 包装）与新版备份（data:{platforms,tools,items}）
      const src = (d && d.data && Array.isArray(d.data.items)) ? d.data : d;
      if (!src || !Array.isArray(src.items)) return this.msg('这不是有效的备份：缺少内容列表', false);
      if (!confirm('将用备份覆盖当前 ' + this.items.length + ' 条内容，继续吗？')) return;
      this.items = src.items;
      if (Array.isArray(src.platforms)) this.platforms = src.platforms;
      if (Array.isArray(src.tools)) this.tools = src.tools;
      save(KEYS.items, this.items); save(KEYS.platforms, this.platforms); save(KEYS.tools, this.tools);
      this.importText = ''; this.msg('已恢复 ' + this.items.length + ' 条内容', true);
    },
    msg(t, ok) { this.backupMsg = t; this.backupMsgOk = ok; }
  };
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
